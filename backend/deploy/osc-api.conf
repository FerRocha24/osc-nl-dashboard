# VirtualHost de la API del Tablero Inteligente OSC NL.
#
# Instalación en la EC2 (RHEL 9 / Amazon Linux 2023):
#   sudo cp osc-api.conf /etc/httpd/conf.d/
#   sudo vi /etc/httpd/conf.d/osc-api.conf     # llena los valores marcados
#   sudo chmod 600 /etc/httpd/conf.d/osc-api.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# El chmod 600 importa: este archivo va a contener la contraseña de la base y
# el secreto de firma. No debe ser legible por otros usuarios del servidor.

<VirtualHost *:80>
    ServerName api.ejemplo.gob.mx

    DocumentRoot /var/www/osc-api

    # ---- Variables de entorno ----------------------------------------------
    # Configuración de la aplicación: credenciales, clave de firma, rutas.
    #
    # Vive en un archivo APARTE y no aquí dentro. Certbot regenera este
    # VirtualHost en cada renovación del certificado y se llevaría las
    # variables por delante; la aplicación perdería su configuración meses
    # después, sin relación aparente con nada. Ya pasó dos veces en este
    # proyecto.
    #
    # Ver osc-api-env.conf.ejemplo. Debe quedar en modo 600, propiedad de
    # root, porque contiene la contraseña de la base de datos.
    IncludeOptional /etc/httpd/conf.d/osc-api-env.conf


    # ---- Permisos ----------------------------------------------------------
    <Directory /var/www/osc-api>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # config/ solo se incluye desde los endpoints; nunca se pide por HTTP.
    <Directory /var/www/osc-api/config>
        Require all denied
    </Directory>

    # deploy/ trae este mismo archivo de ejemplo: fuera del alcance web.
    <Directory /var/www/osc-api/deploy>
        Require all denied
    </Directory>

    # Cinturón y tirantes: bloquea cualquier .env que se copie por accidente.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    # La cabecera Authorization no siempre llega a PHP bajo CGI/FastCGI.
    # Esta línea la reinyecta; config/auth.php ya lee las dos variantes.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog  /var/log/httpd/osc-api-error.log
    CustomLog /var/log/httpd/osc-api-access.log combined
</VirtualHost>

# ---- HTTPS -------------------------------------------------------------------
# El token de sesión viaja en la cabecera Authorization: sin TLS va en claro y
# cualquiera en la red lo puede copiar. Antes de dar acceso a alguien:
#
#   sudo dnf install -y certbot python3-certbot-apache
#   sudo certbot --apache -d api.ejemplo.gob.mx
#
# certbot crea el VirtualHost de :443 y la redirección desde :80.
